spring:
  application:
    name: comparador-documentos
  # Padrão: H2 em arquivo (./data/comparador), não precisa instalar nada e o histórico persiste.
  # Para usar PostgreSQL, ative o perfil "postgres" (veja o final deste arquivo).
  datasource:
    url: jdbc:h2:file:./data/comparador;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 120MB

server:
  port: 8080

app:
  cors-origins:
    - http://localhost:4200
  embeddings:
    enabled: true
    model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  similarity:
    tfidf-paragraph-threshold: 0.30
    embeddings-paragraph-threshold: 0.60

---
# Perfil "postgres": usa o PostgreSQL do docker-compose.yml.
# Uso: --spring.profiles.active=postgres  (no IntelliJ: campo "Active profiles")
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/comparador}
    username: ${DB_USER:comparador}
    password: ${DB_PASSWORD:comparador}